<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Disk used by one mod's project folders</title>
<desc id="desc">Konfig with upstream toolchains: 10.3 GiB, of which 2.3 GiB is its own build output, 5.2 GiB NeoForge NeoForm Runtime copies, 0.9 GiB Forge Mavenizer repository copies, and 1.9 GiB Fabric Loom processed jars and backups. With the Amber toolchain: 2.3 GiB, all of it build output.</desc>
<rect width="760" height="320" rx="8" fill="#1a1a19"/>
<text x="24" y="36" font-size="17" font-weight="600" fill="#ffffff">Disk used by one mod&#8217;s project folders</text>
<text x="24" y="58" font-size="13" fill="#c3c2b7">Konfig, built for 34 Minecraft versions on Fabric, Forge, and NeoForge (85 builds)</text>
<rect x="24" y="77" width="10" height="10" rx="2" fill="#898781"/>
<text x="40" y="86" font-size="12" fill="#c3c2b7">Konfig&#8217;s own build output, 2.3 GiB</text>
<rect x="384" y="77" width="10" height="10" rx="2" fill="#d4631c"/>
<text x="400" y="86" font-size="12" fill="#c3c2b7">NeoForge: NeoForm Runtime copies, 5.2 GiB</text>
<rect x="24" y="96" width="10" height="10" rx="2" fill="#6c71e3"/>
<text x="40" y="105" font-size="12" fill="#c3c2b7">Forge: Mavenizer repository copies, 0.9 GiB</text>
<rect x="384" y="96" width="10" height="10" rx="2" fill="#b98a40"/>
<text x="400" y="105" font-size="12" fill="#c3c2b7">Fabric: Loom processed jars and backups, 1.9 GiB</text>
<rect x="24" y="115" width="10" height="10" rx="2" fill="#de667e"/>
<text x="40" y="124" font-size="12" fill="#c3c2b7">Amber toolchain, everything left, 2.3 GiB</text>
<line x1="170.0" y1="146" x2="170.0" y2="244" stroke="#383835" stroke-width="1"/>
<text x="170.0" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0</text>
<line x1="256.7" y1="146" x2="256.7" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="256.7" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">2</text>
<line x1="343.3" y1="146" x2="343.3" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="343.3" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">4</text>
<line x1="430.0" y1="146" x2="430.0" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="430.0" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">6</text>
<line x1="516.7" y1="146" x2="516.7" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="516.7" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">8</text>
<line x1="603.3" y1="146" x2="603.3" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="603.3" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">10</text>
<line x1="690.0" y1="146" x2="690.0" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="690.0" y="262" font-size="12" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">12</text>
<text x="690.0" y="278" font-size="12" text-anchor="end" fill="#898781">GiB</text>
<text x="156" y="172.0" font-size="13" text-anchor="end" fill="#ffffff">Upstream tools</text>
<rect x="170.0" y="156" width="96.8" height="22" fill="#898781"/>
<rect x="268.8" y="156" width="224.6" height="22" fill="#d4631c"/>
<rect x="495.4" y="156" width="37.9" height="22" fill="#6c71e3"/>
<path d="M535.3,156 H613.6 Q617.6,156 617.6,160 V174 Q617.6,178 613.6,178 H535.3 Z" fill="#b98a40"/>
<text x="625.6" y="172.0" font-size="14" font-weight="600" fill="#ffffff">10.3 GiB</text>
<text x="156" y="220.0" font-size="13" text-anchor="end" fill="#ffffff">Amber toolchain</text>
<path d="M170.0,204 H264.8 Q268.8,204 268.8,208 V222 Q268.8,226 264.8,226 H170.0 Z" fill="#de667e"/>
<text x="276.8" y="220.0" font-size="14" font-weight="600" fill="#ffffff">2.3 GiB</text>
<text x="24" y="302" font-size="12" fill="#898781">Measured on Windows (NTFS). Shared Gradle caches, paid once per machine, are not included.</text>
</svg>
